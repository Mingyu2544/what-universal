<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WHAT UNIVERSAL — Admin</title>

<link rel="stylesheet" href="style.css">

<style>

.admin-page {
    max-width: 900px;
    margin: 0 auto;
}

.admin-card {
    background: #ffffff;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
}

.admin-card h2 {
    margin-top: 0;
    margin-bottom: 8px;
}

.admin-card p {
    color: #777;
    margin-bottom: 25px;
}

.admin-form {
    display: grid;
    gap: 18px;
}

.admin-group {
    display: grid;
    gap: 8px;
}

.admin-group label {
    font-weight: 600;
}

.admin-group input,
.admin-group textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 13px 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
}

.admin-group input:focus,
.admin-group textarea:focus {
    border-color: #111;
}

.admin-group textarea {
    min-height: 150px;
    resize: vertical;
}

.admin-button {
    border: none;
    background: #111;
    color: white;
    padding: 14px 20px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

.admin-button:hover {
    opacity: 0.9;
}

.admin-button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.admin-message {
    margin-top: 18px;
    padding: 13px 15px;
    border-radius: 10px;
    display: none;
}

.admin-message.success {
    display: block;
    background: #eaf8ef;
    color: #217a3c;
}

.admin-message.error {
    display: block;
    background: #fff0f0;
    color: #b42318;
}

</style>

</head>

<body>

<div class="app">

<aside class="sidebar">

    <div class="logo">
        <h2>WHAT<br>UNIVERSAL</h2>
    </div>

    <div class="menu-title">ระบบ</div>

    <a href="index.html" class="category-btn">
        <span>←</span>
        กลับหน้ากฎ
    </a>

</aside>


<main class="main">

<div class="container admin-page">

<header class="page-header">

    <div class="header-label">ADMIN PANEL</div>

    <h1>จัดการกฎเซิร์ฟเวอร์</h1>

    <p>
        เพิ่มกฎใหม่เข้าสู่ระบบ
    </p>

</header>


<div class="admin-card">

<h2>เพิ่มกฎใหม่</h2>

<p>
กรอกข้อมูลด้านล่างเพื่อเพิ่มกฎเข้าสู่ Google Sheets
</p>


<form id="adminForm" class="admin-form">


<div class="admin-group">

<label for="category">
หมวดหมู่
</label>

<input
    type="text"
    id="category"
    placeholder="เช่น กฎเซิร์ฟเวอร์"
    required
>

</div>


<div class="admin-group">

<label for="title">
หัวข้อ
</label>

<input
    type="text"
    id="title"
    placeholder="เช่น มารยาททางสังคม"
    required
>

</div>


<div class="admin-group">

<label for="body">
รายละเอียด
</label>

<textarea
    id="body"
    placeholder="รายละเอียดของกฎ..."
    required
></textarea>

</div>


<div class="admin-group">

<label for="order">
ลำดับ
</label>

<input
    type="number"
    id="order"
    value="1"
    min="1"
>

</div>


<button
    type="submit"
    class="admin-button"
    id="saveButton"
>
    บันทึกกฎ
</button>


</form>


<div
    id="message"
    class="admin-message"
></div>


</div>

</div>

</main>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyI9BcrBHCGzaNsxMiR2BOq68uRGagIcu8jq8HuWjJ6vjNmise3J_MLpT5D_U-rLF-4/exec";


const form =
document.getElementById("adminForm");

const message =
document.getElementById("message");

const saveButton =
document.getElementById("saveButton");


function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "admin-message " + type;

}


/* =========================
   ตรวจสอบว่าข้อมูลถูกเพิ่มจริง
========================= */

function verifyRule(category, title, body) {

    return new Promise(function(resolve) {

        const callbackName =
            "verify_" + Date.now();

        window[callbackName] =
            function(data) {

                try {

                    const rules =
                        Array.isArray(data)
                            ? data
                            : [];

                    const found =
                        rules.some(function(rule) {

                            return (
                                String(rule.category || "").trim() === category &&
                                String(rule.title || "").trim() === title &&
                                String(rule.body || "").trim() === body
                            );

                        });

                    resolve(found);

                } catch (error) {

                    resolve(false);

                }

                delete window[callbackName];

            };


        const script =
            document.createElement("script");

        script.src =
            API_URL +
            "?callback=" +
            callbackName +
            "&t=" +
            Date.now();


        script.onerror =
            function() {

                resolve(false);

                delete window[callbackName];

            };


        document.body.appendChild(script);


        setTimeout(function() {

            if (window[callbackName]) {

                delete window[callbackName];

                resolve(false);

            }

        }, 10000);

    });

}


/* =========================
   บันทึกข้อมูล
========================= */

form.addEventListener(
"submit",
async function(event) {

    event.preventDefault();


    const category =
        document
        .getElementById("category")
        .value
        .trim();


    const title =
        document
        .getElementById("title")
        .value
        .trim();


    const body =
        document
        .getElementById("body")
        .value
        .trim();


    const order =
        document
        .getElementById("order")
        .value;


    if (!category || !title || !body) {

        showMessage(
            "กรุณากรอกข้อมูลให้ครบ",
            "error"
        );

        return;

    }


    saveButton.disabled = true;

    saveButton.textContent =
        "กำลังบันทึก...";


    showMessage(
        "กำลังส่งข้อมูลไปยัง Google Sheets...",
        "success"
    );


    /* =========================
       ส่งข้อมูล
    ========================= */

    const iframe =
        document.createElement("iframe");

    iframe.style.display = "none";


    iframe.src =
        API_URL +
        "?action=add" +
        "&category=" +
        encodeURIComponent(category) +
        "&title=" +
        encodeURIComponent(title) +
        "&body=" +
        encodeURIComponent(body) +
        "&order=" +
        encodeURIComponent(order) +
        "&t=" +
        Date.now();


    document.body.appendChild(iframe);


    /*
       รอให้ Apps Script เขียนข้อมูล
    */

    await new Promise(function(resolve) {

        setTimeout(resolve, 2000);

    });


    /* =========================
       ตรวจสอบ Google Sheets จริง
    ========================= */

    showMessage(
        "กำลังตรวจสอบข้อมูล...",
        "success"
    );


    let verified = false;


    /*
       ตรวจสอบสูงสุด 3 ครั้ง
       ครั้งละ 2 วินาที
    */

    for (
        let i = 0;
        i < 3;
        i++
    ) {

        verified =
            await verifyRule(
                category,
                title,
                body
            );


        if (verified) {

            break;

        }


        await new Promise(
            function(resolve) {

                setTimeout(
                    resolve,
                    2000
                );

            }
        );

    }


    iframe.remove();


    if (verified) {

        showMessage(
            "เพิ่มกฎสำเร็จแล้ว ✓ ข้อมูลถูกบันทึกใน Google Sheets",
            "success"
        );


        form.reset();


        document
        .getElementById("order")
        .value = "1";


    } else {

        showMessage(
            "ยังไม่พบข้อมูลใน Google Sheets กรุณารอสักครู่แล้วตรวจสอบอีกครั้ง",
            "error"
        );

    }


    saveButton.disabled = false;

    saveButton.textContent =
        "บันทึกกฎ";

});

</script>

</body>
</html>
