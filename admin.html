<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WHAT UNIVERSAL — Admin</title>

<link rel="stylesheet" href="style.css">

<style>
.admin-page {
    max-width: 900px;
    margin: 0 auto;
}

.admin-card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,.05);
}

.admin-card h2 {
    margin: 0 0 8px;
}

.admin-card > p {
    margin: 0 0 25px;
    color: #6b7280;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: 700;
}

.form-group input,
.form-group textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 13px 15px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: #111827;
}

.form-group textarea {
    min-height: 150px;
    resize: vertical;
}

.save-button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: #111827;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.save-button:hover {
    background: #000;
}

.save-button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.admin-message {
    margin-top: 15px;
    padding: 12px 15px;
    border-radius: 10px;
    display: none;
}

.admin-message.success {
    display: block;
    background: #ecfdf5;
    color: #047857;
}

.admin-message.error {
    display: block;
    background: #fef2f2;
    color: #b91c1c;
}

.back-link {
    display: inline-block;
    margin-bottom: 20px;
    color: #111827;
    text-decoration: none;
    font-weight: 700;
}
</style>

</head>

<body>

<div class="app">

<aside class="sidebar">

    <div class="logo">
        <h2>WHAT<br>UNIVERSAL</h2>
    </div>

    <div class="menu-title">ระบบ</div>

    <a href="index.html" class="category-btn">
        <span>←</span>
        กลับหน้ากฎ
    </a>

</aside>


<main class="main">

<div class="container admin-page">

<header class="page-header">

    <div class="header-label">
        ADMIN PANEL
    </div>

    <h1>
        จัดการกฎเซิร์ฟเวอร์
    </h1>

    <p>
        เพิ่มกฎใหม่เข้าสู่ระบบ WHAT UNIVERSAL
    </p>

</header>


<a href="index.html" class="back-link">
    ← กลับหน้ากฎเซิร์ฟเวอร์
</a>


<div class="admin-card">

<h2>
    เพิ่มกฎใหม่
</h2>

<p>
    กรอกข้อมูลด้านล่างเพื่อเพิ่มกฎลงใน Google Sheets
</p>


<form id="adminForm">

<div class="form-group">

<label for="category">
    หมวดหมู่
</label>

<input
    type="text"
    id="category"
    placeholder="เช่น กฎเซิร์ฟเวอร์"
    required
>

</div>


<div class="form-group">

<label for="title">
    หัวข้อ
</label>

<input
    type="text"
    id="title"
    placeholder="เช่น มารยาททางสังคม"
    required
>

</div>


<div class="form-group">

<label for="body">
    รายละเอียด
</label>

<textarea
    id="body"
    placeholder="กรอกรายละเอียดของกฎ..."
    required
></textarea>

</div>


<div class="form-group">

<label for="order">
    ลำดับ
</label>

<input
    type="number"
    id="order"
    value="1"
    min="1"
>

</div>


<button
    type="submit"
    class="save-button"
    id="saveButton"
>
    บันทึกกฎ
</button>


<div
    id="message"
    class="admin-message"
></div>

</form>

</div>

</div>

</main>

</div>


<script>

const API_URL =
    "https://script.google.com/macros/s/AKfycbyI9BcrBHCGzaNsxMiR2BOq68uRGagIcu8jq8HuJwJ6vjNmise3J_MLpT5D_U-rLF-4/exec";


const form =
    document.getElementById("adminForm");

const message =
    document.getElementById("message");

const saveButton =
    document.getElementById("saveButton");


function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "admin-message " + type;

}


/* =========================
   บันทึกกฎด้วย JSONP
========================= */

form.addEventListener("submit", function(event) {

    event.preventDefault();


    const category =
        document.getElementById("category")
        .value
        .trim();


    const title =
        document.getElementById("title")
        .value
        .trim();


    const body =
        document.getElementById("body")
        .value
        .trim();


    const order =
        document.getElementById("order")
        .value;


    if (!category || !title || !body) {

        showMessage(
            "กรุณากรอกข้อมูลให้ครบ",
            "error"
        );

        return;
    }


    saveButton.disabled = true;

    saveButton.textContent =
        "กำลังบันทึก...";


    const callbackName =
        "addRuleCallback_" + Date.now();


    window[callbackName] =
        function(result) {

            if (result && result.success) {

                showMessage(
                    "เพิ่มกฎสำเร็จแล้ว",
                    "success"
                );

                form.reset();

                document.getElementById("order")
                    .value = "1";

            } else {

                showMessage(
                    result && result.message
                        ? result.message
                        : "บันทึกไม่สำเร็จ",
                    "error"
                );

            }


            saveButton.disabled = false;

            saveButton.textContent =
                "บันทึกกฎ";


            delete window[callbackName];

            if (script) {
                script.remove();
            }

        };


    const script =
        document.createElement("script");


    script.src =
        API_URL +
        "?action=add" +
        "&category=" +
        encodeURIComponent(category) +
        "&title=" +
        encodeURIComponent(title) +
        "&body=" +
        encodeURIComponent(body) +
        "&order=" +
        encodeURIComponent(order) +
        "&callback=" +
        callbackName;


    script.onerror =
        function() {

            showMessage(
                "ไม่สามารถเชื่อมต่อกับระบบได้",
                "error"
            );


            saveButton.disabled = false;

            saveButton.textContent =
                "บันทึกกฎ";


            delete window[callbackName];

            script.remove();

        };


    document.body.appendChild(script);

});

</script>

</body>
</html>
