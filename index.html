<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WHAT UNIVERSAL</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="app">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <h2>
                WHAT<br>
                UNIVERSAL
            </h2>

        </div>


        <div class="menu-title">
            หมวดหมู่
        </div>


        <!-- เมนูหมวดหมู่จะถูกสร้างจาก Google Sheets -->

        <div id="categoryMenu">

            <button
                class="menu-item active"
                data-category="all"
            >
                กฎทั้งหมด
            </button>

        </div>


        <div class="menu-title">
            ระบบ
        </div>


        <a
            href="admin.html"
            class="menu-item"
        >
            ⚙ Admin
        </a>

    </aside>



    <!-- MAIN -->

    <main class="main">

        <div class="container">


            <!-- HEADER -->

            <header class="page-header">

                <h1>
                    WHAT UNIVERSAL
                </h1>

                <p>
                    กฎและข้อบังคับสำหรับผู้เล่น
                </p>

            </header>



            <!-- SEARCH -->

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="ค้นหากฎ เช่น มารยาท, อุปกรณ์สื่อสาร..."
                >

            </div>



            <!-- STATUS -->

            <div
                id="status"
                class="status"
            ></div>



            <!-- RULE COUNT -->

            <div
                id="ruleCount"
                class="rule-count"
            >
                กำลังโหลด...
            </div>



            <!-- RULES -->

            <section
                id="rulesContainer"
                class="rules"
            >

                <div class="loading">
                    กำลังโหลดกฎ...
                </div>

            </section>


        </div>

    </main>


</div>


<script src="script.js"></script>

</body>

</html>
