<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WHAT UNIVERSAL — Server Rules</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="app">


    <!-- =========================================
         SIDEBAR
         ========================================= -->

    <aside class="sidebar">


        <!-- LOGO -->

        <div class="logo">

            <h2>
                WHAT<br>
                UNIVERSAL
            </h2>

        </div>


        <!-- MENU -->

        <div class="menu-title">
            หมวดหมู่
        </div>


        <nav id="categoryMenu">

            <button class="category-btn active">

                <span>▦</span>

                กฎทั้งหมด

            </button>

        </nav>


    </aside>



    <!-- =========================================
         MAIN
         ========================================= -->

    <main class="main">


        <div class="container">


            <!-- HEADER -->

            <header class="page-header">


                <div class="header-label">
                    SERVER RULES
                </div>


                <h1>
                    กฎเซิร์ฟเวอร์
                </h1>


                <p>
                    กรุณาศึกษาและทำความเข้าใจกฎก่อนเริ่มเล่น
                </p>


            </header>



            <!-- SEARCH -->

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="ค้นหากฎ เช่น Roleplay, ยานพาหนะ, อาชีพ..."
                    autocomplete="off"
                >

            </div>



            <!-- STATUS -->

            <div
                id="status"
                class="status"
            >
                กำลังโหลด...
            </div>


            <div
                id="ruleCount"
                class="rule-count"
            >
                -
            </div>



            <!-- RULES -->

            <section
                id="rulesContainer"
                class="rules"
            >

                <div class="loading">
                    กำลังโหลดกฎเซิร์ฟเวอร์...
                </div>

            </section>


        </div>


    </main>


</div>


<script src="script.js?v=2"></script>

</body>

</html>
